name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Interfaces and format
        run: |
          moon info
          moon fmt
          git diff --exit-code
          moon fmt --check
      - name: Strict checks, tests and build
        run: |
          moon check --target ${{ matrix.target }} --deny-warn
          moon test --target ${{ matrix.target }} --deny-warn
          moon build --target ${{ matrix.target }} --deny-warn
      - name: Corpus integrity and engineering audit
        run: |
          python scripts/check_reference.py
          python scripts/audit.py
      - name: Real workflows and CLI
        run: python scripts/smoke.py --target ${{ matrix.target }}
